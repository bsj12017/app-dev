<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>
</head>
<body>
    <h1>도서 목록</h1>
    <button id="loadBtn">목록 불러오기</button>
    <table border="1">
        <thead>
            <tr>
                <th>번호</th>
                <th>도서명</th>
                <th>저자</th>
                <th>출판연도</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="bookTableBody">
            <!-- 자바스크립트가 여기에 목록을 채워넣습니다 -->
        </tbody>
    </table>

    <script>
        // 버튼을 누르면 작동하는 코드
        document.getElementById('loadBtn').addEventListener('click', async () => {
            try {
                // FastAPI의 /books 주소로 데이터 요청
                const response = await fetch('/books');
                const books = await response.json();

                const tbody = document.getElementById('bookTableBody');
                tbody.innerHTML = ''; // 기존 내용 초기화

                // 받아온 책 목록을 반복문으로 화면에 그려줌
                books.forEach(book => {
                    const row = `<tr>
                        <td>${book.id}</td>
                        <td>${book.title}</td>
                        <td>${book.author}</td>
                        <td>${book.year}</td>
                        <td>-</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("데이터를 불러오는 중 에러 발생:", error);
            }
        });
    </script>
</body>
</html>
