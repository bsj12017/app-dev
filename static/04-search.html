<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>제목 검색</title>
</head>
<body>
    <h1>제목 검색</h1>
    <input type="text" id="keywordInput" placeholder="검색어 입력">
    <button onclick="searchBooks()">검색</button>
    
    <ul id="result"></ul>

    <script>
        async function searchBooks() {
            const keyword = document.getElementById("keywordInput").value;
            const response = await fetch(`/books/search?keyword=${keyword}`);
            const books = await response.json();

            const ul = document.getElementById("result");
            ul.innerHTML = "";

            // 검색 결과가 0건일 때
            if (books.length === 0) {
                ul.innerHTML = "<li>검색 결과가 없습니다.</li>";
                return;
            }

            // 결과가 있을 때
            for (const b of books) {
                const li = document.createElement("li");
                li.textContent = `${b.id}. ${b.title} (${b.author})`;
                ul.appendChild(li);
            }
        }
    </script>
</body>
</html>
